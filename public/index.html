<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>re:informant · re:generates</title>
<meta name="theme-color" content="#0D1814">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Martian+Mono:wght@500;600&family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#639685; --sage-deep:#557F71; --sage-mist:#9CC4B4;
  --ink:#0D1814; --ink-2:#15251E; --ink-3:#21362C; --paper:#F1F5EE;
  --gold:#FFC531; --ember:#FF8A3D; --red:#ff4d4d;
  --display:"Pixelify Sans",ui-monospace,monospace;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--text);font-size:15px;line-height:1.45}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 88px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--sage-mist)}
.re{text-transform:none}
.gold{color:var(--gold)}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 2px 10px}
.word{font-family:var(--display);font-weight:700;font-size:30px;line-height:.86;letter-spacing:-.01em;margin:0}
.word span{color:var(--sage-mist)}
.kicker{margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:3px;background:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);animation:pulse 1.6s infinite}
.chip.off i{background:var(--sage-mist);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink-2);border-top:1px solid var(--ink-3);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:13px 0 12px;color:var(--sage-mist);border-top:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--paper);border-top-color:var(--gold)}
section[hidden]{display:none}

/* stage */
.stage{position:relative;background:#000;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--ink-3)}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.call{min-height:44px;padding:10px 2px 4px;font-size:15px}
.call b{font-family:var(--display);font-weight:600}
.ctrl{display:flex;gap:6px;align-items:center;margin:6px 0 14px}
.ctrl button{background:var(--ink-2);padding:9px 12px;border-radius:3px;min-width:44px}
.ctrl button:active{background:var(--ink-3)}
.ctrl .grow{flex:1}
.ctrl button.on{background:var(--ink-3);color:var(--gold)}

/* lists */
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.h2 h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.seg{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:3px;background:var(--ink-2);color:var(--sage-mist)}
.seg button.on{background:var(--paper);color:var(--ink)}
.bout{display:grid;grid-template-columns:36px 1fr auto 1fr 36px;align-items:center;gap:8px;padding:8px;border-radius:4px;background:var(--ink-2);margin-bottom:6px;width:100%;text-align:left}
.bout.now{box-shadow:inset 0 0 0 1px var(--gold)}
.bout.mine{background:var(--ink-3)}
.bout .r{text-align:right}
.bout .vs{font-family:var(--mono);font-size:10px;color:var(--sage-mist);text-align:center;min-width:44px}
.nm{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:10px;color:var(--sage-mist);letter-spacing:.04em;text-transform:uppercase}
.w{color:var(--gold)}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:var(--sage);border-radius:2px}

/* board */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.stat{background:var(--ink-2);border-radius:4px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.row{display:grid;grid-template-columns:30px 36px 1fr auto;align-items:center;gap:10px;padding:7px 8px;border-radius:4px;width:100%;text-align:left}
.row:nth-child(odd){background:var(--ink-2)}
.row.mine{box-shadow:inset 3px 0 0 var(--sage-mist)}
.row .rk{font-family:var(--mono);font-size:12px;color:var(--sage-mist);text-align:right}
.row .px{font-family:var(--mono);font-size:13px;text-align:right}
.booth{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--gold)}
.booth::before,.booth::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.5}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 5px;border-radius:2px;background:var(--ink-3);color:var(--sage-mist);vertical-align:2px}
.tag.ember{color:var(--ember)}
.tag.gold{color:var(--ink);background:var(--gold)}
.search{width:100%;padding:11px 12px;border-radius:4px;border:1px solid var(--ink-3);background:var(--ink-2);color:var(--paper);margin-bottom:8px}

/* enter */
.card{background:var(--ink-2);border-radius:6px;padding:12px;margin-bottom:10px}
.mine-card{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.btn{background:var(--gold);color:var(--ink);font-weight:600;padding:12px 16px;border-radius:4px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--ink-3);color:var(--paper)}
.btn.small{padding:8px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid button{padding:0;border-radius:3px;outline:2px solid transparent;outline-offset:1px}
.grid button.on{outline-color:var(--gold)}
.grid img{width:100%;height:auto}
.pick{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:start;margin:12px 0}
.note{background:var(--ink-3);border-radius:4px;padding:10px 12px;font-size:14px;margin:10px 0}
label.field{display:block;margin:10px 0}
label.field input{width:100%;margin-top:6px;padding:11px 12px;border-radius:4px;border:1px solid var(--ink-3);background:var(--ink);color:var(--paper);font-family:var(--display);font-size:18px;text-transform:uppercase}

/* lore */
.lore p{margin:0 0 12px}
.lore h3{font-family:var(--display);font-weight:600;font-size:18px;margin:22px 0 8px}
.lore .noir{background:var(--ink-2);border-left:3px solid var(--gold);padding:14px 16px;border-radius:0 4px 4px 0;font-size:16px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.tri div{background:var(--ink-2);border-radius:4px;padding:10px 6px}
.tri b{display:block;font-family:var(--display);font-size:16px}
table.sp{width:100%;border-collapse:collapse;font-size:14px}
table.sp td{padding:7px 6px;border-bottom:1px solid var(--ink-3);vertical-align:top}
table.sp td:first-child{white-space:nowrap}

/* profile sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(13,24,20,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:10px 10px 0 0;
  padding:16px 14px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--ink-3)}
.sheet .top{display:grid;grid-template-columns:118px 1fr auto;gap:14px;align-items:center}
.bar{height:6px;background:var(--ink-3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--sage-mist)}
.kv{display:grid;grid-template-columns:62px 1fr 40px;gap:8px;align-items:center;margin:5px 0}
.gear{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.gear div{background:var(--ink-2);border-radius:3px;padding:6px 2px;text-align:center;font-family:var(--mono);font-size:8px;line-height:1.3;color:#5a7369}
.gear div.on{background:var(--ink-3);color:var(--gold)}
.hist{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ink-2)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:4px;z-index:60;font-weight:600;max-width:90vw}
.toast[hidden]{display:none}
@media (min-width:900px){ .wrap{max-width:620px} }
img.px.card-img{width:100%;height:auto;background:none;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.red{color:var(--red)}
.log{max-height:168px;overflow:auto;border-top:1px solid var(--ink-3);padding:6px 0;margin:2px 0 4px;font-size:14px;scroll-behavior:smooth}
.log .line{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:4px 2px}
.log .line img{border-radius:2px}
.log .line.sys{color:var(--sage-mist)}
.log .line.tip{color:#d9c48a}
.log .line.big{color:var(--paper);font-weight:600}
.log .dot{display:block;width:22px;height:22px;border-radius:2px;background:var(--ink-3)}
.table{display:block;width:100%;text-align:left;background:var(--ink-2);border-radius:4px;padding:8px;margin-bottom:6px}
.table.now{box-shadow:inset 0 0 0 1px var(--gold)}
.table.mine{background:var(--ink-3)}
.table .tt{display:flex;justify-content:space-between;margin-bottom:6px}
.faces{display:flex;gap:4px;flex-wrap:wrap}
.face{position:relative;display:block}
.face.rat::after{content:"RAT";position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-family:var(--mono);font-size:7px;color:#fff;background:var(--red)}
.sel{width:100%;margin-top:6px;padding:11px 10px;border-radius:4px;border:1px solid var(--ink-3);background:var(--ink);color:var(--paper);font-family:var(--text);font-size:15px}
.pbar{display:flex;justify-content:space-between;padding:10px 2px 6px}
.rolechip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:8px 10px;border-radius:4px;margin-bottom:8px;background:var(--ink-3)}
.rolechip.rat{background:#3a1414;color:#ffb3b3}
.rolechip.clean{color:var(--sage-mist)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip-btn{display:flex;align-items:center;gap:6px;background:var(--ink-2);border-radius:20px;padding:4px 10px 4px 4px;white-space:nowrap;font-family:var(--display);font-size:14px}
.chip-btn img{border-radius:50%}
.chip-btn.on{background:var(--gold);color:var(--ink)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lbtn{background:var(--ink-2);border-radius:4px;padding:10px 8px;text-align:left;font-size:14px;line-height:1.25}
.lbtn.red{box-shadow:inset 3px 0 0 var(--red)}
.lbtn.gold{box-shadow:inset 3px 0 0 var(--gold);color:var(--gold)}
.lbtn[disabled]{opacity:.4}
.notes{font-size:14px;color:#d9c48a}
.card.mode{display:flex;align-items:center;gap:12px;justify-content:space-between}
.me{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.sharebox{display:flex;gap:6px}
.sharebox input{flex:1;min-width:0;padding:9px 10px;border-radius:4px;border:1px solid var(--ink-3);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px}
.log .line.mine{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="word"><span>re:</span>informant</h1>
      <div class="kicker mono muted">Who's the rat at DeStefano's?</div>
    </div>
    <div class="chip mono" id="chip"><i></i><span id="chipText">re:loading</span></div>
  </header>

  <section id="tab-watch">
    <div class="stage"><canvas id="stage" width="240" height="135" aria-label="The table"></canvas></div>
    <div class="call" id="call" aria-live="polite"></div>
    <div class="log" id="log" aria-label="Table talk"></div>
    <div class="ctrl">
      <button id="bPrev" aria-label="Previous bout">◀</button>
      <button id="bPlay" aria-label="Play or pause">❚❚</button>
      <button id="bNext" aria-label="Next bout">▶</button>
      <button id="bSkip" class="mono" aria-label="Skip to result">END</button>
      <span class="grow"></span>
      <button id="bSpeed" class="mono">1×</button>
      <button id="bAuto" class="mono on" aria-pressed="true">AUTO</button>
    </div>
    <div class="h2"><h2 id="floorTitle">Tonight's tables</h2><span class="mono muted" id="floorSub"></span></div>
    <div class="seg" id="bellTabs"></div>
    <div id="bouts"></div>
    <div id="floorNote" class="sub" style="margin-top:8px"></div>
  </section>

  <section id="tab-play" hidden>
    <div id="playMenu"></div>
    <div id="playTable" hidden>
      <div class="stage"><canvas id="liveStage" width="240" height="135" aria-label="Your table"></canvas></div>
      <div id="playPanel"></div>
      <div class="log" id="playLog" aria-label="Table talk"></div>
    </div>
  </section>

  <section id="tab-board" hidden>
    <div class="h2"><h2 id="boardTitle">The board</h2><span class="mono muted" id="boardSub"></span></div>
    <div class="stats" id="boardStats"></div>
    <div class="seg" id="boardSeg"><button class="on" data-f="all">ALL</button><button data-f="mine">MINE</button><button data-f="players">PLAYERS</button></div>
    <input class="search" id="search" placeholder="Look up a fighter or a player" autocomplete="off">
    <div id="board"></div>
  </section>

  <section id="tab-enter" hidden>
    <div id="enter"></div>
  </section>

  <section id="tab-lore" hidden class="lore"></section>
</div>

<nav class="tabs"><div role="tablist">
  <button role="tab" class="mono" data-tab="watch" aria-selected="true">ROOM</button>
  <button role="tab" class="mono" data-tab="play" aria-selected="false">PLAY</button>
  <button role="tab" class="mono" data-tab="board" aria-selected="false">BOARD</button>
  <button role="tab" class="mono" data-tab="enter" aria-selected="false">ENTER</button>
  <button role="tab" class="mono" data-tab="lore" aria-selected="false">LORE</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>

const clockTimers = [];

function update(dt) {

  if (PB.clock >= PB.nextAt) {
    const evs = PB.bout.events;
    if (PB.cursor >= evs.length) { if (PB.auto) nextBout(); else PB.phase = 'idle-end'; return; }

}

function watchList() {
  const out = [];

}

  if (!M.W) return;
  const list = watchList();

  const latest = list.filter(x => x.r === list[0].r);
  const mine = latest.find(x => x.g.ids.some(isMine) && !PB.watched.has(gameKey(x.W, x.g)));

    if (M.W) { const nb = M.W.nextBell(now()); if (nb) textC(g, 'NEXT DEAL IN ' + fmtLeft(nb - now()).toUpperCase(), SW / 2, 63, PAL.paper, 1, null); }
    return;
  }

  for (const k of order) {
    const p = seatPos(k, n), f = PB.F[k];
    const top = p.base - 36;

    const p = seatPos(k, n), f = PB.F[k];
    const y = 110 + (k % 2) * 10, nmx = fitText(f.name.replace(/#/g, '').trim(), 26);
    const w = Math.max(textW(nmx) + 4, 14);
    const mine = isMine(f.id);
    g.fillStyle = mine ? PAL.gold : PAL.ink; g.fillRect(p.x - w / 2 - 1, y - 1, w + 2, 10);
    g.fillStyle = PB.alive[k] ? PAL.ink2 : PAL.ink; g.fillRect(p.x - w / 2, y, w, 8);

      const b = seatPos(PB.target, n), by = b.base - 40;
      const mx = (a.x + b.x) / 2, my = Math.min(ay, by) - 16;
      g.fillStyle = col;

    }
    const bw = textW(icon) + 6;
    g.fillStyle = PAL.ink; g.fillRect(a.x - bw / 2 - 1, ay - 9, bw + 2, 10);
    g.fillStyle = PAL.paper; g.fillRect(a.x - bw / 2, ay - 8, bw, 8); g.fillRect(a.x - 1, ay, 3, 2);
    drawText(g, icon, Math.round(a.x - textW(icon) / 2), ay - 7, col === PAL.paper ? PAL.ink : col);

      const b = seatPos(on, n);

  }
  // header
  g.fillStyle = 'rgba(13,24,20,.85)'; g.fillRect(0, 0, 58, 9);
  drawText(g, PB.W.after ? 'EXHIBITION' : 'BELL ' + (gm.r + 1) + ' T' + (gm.i + 1), 2, 2, PAL.gold);
  if (!PB.playing) { g.fillStyle = 'rgba(13,24,20,.5)'; g.fillRect(0, 0, SW, SH); textC(g, 'PAUSED', SW / 2, 60, PAL.paper, 2); }
}

/* =====================================================================
   PLAY — sit at the table yourself: solo, public, friends
   ===================================================================== */
const PID_KEY = 'informant-pid', REC_KEY = 'informant-record', PICK_KEY = 'informant-pick';
const PL = {
  where: null,        // 'local' (solo, runs here) | 'remote' (public/friends, runs on the site's server)
  mode: null, st: null, k: null, id: null, view: null, since: 0, log: [], notes: [], reveal: {}, talk: null, voteAnim: null,
  sel: -1, offset: 0, busy: false, pollT: 0, recorded: new Set(), menuOpen: false, code: '',
};
const pid = (() => { let p = store.get(PID_KEY, null); if (!p || !/^[a-z0-9]{12}$/.test(p)) { p = newId().padEnd(12, '0').slice(0, 12); store.set(PID_KEY, p); } return p; })();
let pick = store.get(PICK_KEY, null) || { look: Math.floor(Math.random() * 30), name: '' };
const record = () => store.get(REC_KEY, { w: 0, l: 0, ratW: 0, ratL: 0, called: 0 });
const pnow = () => Date.now();
const liveCv = $('#liveStage'), lg = liveCv.getContext('2d');

/* ---------- who you sit down as ---------- */
function pickPlayer() {
  const name = cleanName(pick.name);
  if (pick.token && pick.px) return { pid, name: name || '#' + pick.token, token: pick.token, px: pick.px, type: pick.type, style: pick.style };
  return { pid, name: name || B.LOOKS[pick.look].name, look: pick.look };
}
function pickChoices() {
  const out = [];
  if (S.mode === 'site' && W8.owned) for (const t of W8.owned) { const px = pxOf(t.id); if (px) out.push({ token: t.id, px, type: t.type, style: t.style, label: '#' + t.id }); }
  if (S.mode !== 'site' && OWN.px && ownAgent()) { const a = ownAgent(); out.push({ token: a.token, px: a.px, type: a.type, style: a.style, label: '#' + a.token }); }
  B.LOOKS.forEach((l, i) => out.push({ look: i, label: l.name }));
  return out;
}

/* ---------- hosts ---------- */
async function playApi(body, auth) {
  const headers = { 'content-type': 'application/json' };
  if (W8.session && auth !== false) headers.authorization = 'Bearer ' + W8.session.session;
  const r = await fetch(API + '/play', { method: 'POST', headers, body: JSON.stringify(body), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
function resetTable() {
  clearInterval(PL.pollT);
  Object.assign(PL, { where: null, mode: null, st: null, k: null, id: null, view: null, since: 0, log: [], notes: [], reveal: {}, talk: null, voteAnim: null, sel: -1, busy: false });
  $('#playLog').innerHTML = '';
}
async function startMode(mode) {
  store.set(PICK_KEY, pick);
  resetTable();
  PL.mode = mode;
  if (mode === 'solo') {
    const now = pnow();
    PL.where = 'local';
    PL.st = Live.createTable({ id: 'SOLO', mode: 'solo', now, seed: (Math.random() * 2 ** 31) | 0, host: pid });
    Live.join(PL.st, pickPlayer(), now);
    Live.act(PL.st, 0, { type: 'start' }, now);
    ingest(Live.view(PL.st, 0, 0, now));
    return;
  }
  PL.where = 'remote'; PL.busy = true; renderPlay();
  try {
    const op = mode === 'public' ? 'quick' : PL.code ? 'join' : 'create';
    const j = await playApi({ op, code: PL.code, ...pickPlayer() });
    PL.k = j.k; PL.id = j.id; PL.busy = false;
    ingest(j.view);
    PL.pollT = setInterval(pollRemote, 1500);
  } catch (e) { PL.busy = false; resetTable(); toast(e.message); renderPlay(); }
}
async function pollRemote() {
  if (!PL.k || PL.busy) return;
  try {
    const r = await fetch(API + '/play?k=' + encodeURIComponent(PL.k) + '&since=' + PL.since, { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) { if (r.status === 404 || r.status === 401) { toast(j.error || 'That table is gone.'); resetTable(); renderPlay(); } return; }
    ingest(j);
  } catch {}
}
async function doAct(action) {
  if (PL.where === 'local') {
    try { Live.act(PL.st, 0, action, pnow()); ingest(Live.view(PL.st, 0, PL.since, pnow())); }
    catch (e) { toast(e.message); }
    return;
  }
  try { ingest(await playApi({ op: 'act', k: PL.k, action: { ...action, since: PL.since } }, false)); }
  catch (e) { toast(e.message); }
}
function localTick() {
  if (PL.where !== 'local' || !PL.st) return;
  if (Live.tick(PL.st, pnow())) ingest(Live.view(PL.st, 0, PL.since, pnow()));
}

/* ---------- what happened ---------- */
const liveName = i => PL.view && PL.view.seats[i] ? PL.view.seats[i].name : '?';
const liveB = i => `<b>${esc(liveName(i))}</b>`;
function addLog(html, cls = '', who = -1) {
  const v = PL.view, li = document.createElement('div');
  li.className = 'line ' + cls;
  const s = v && who >= 0 ? v.seats[who] : null;
  li.innerHTML = (s ? img(s, 22) : '<span class="dot"></span>') + `<div>${html}</div>`;
  const box = $('#playLog'); box.appendChild(li); box.scrollTop = box.scrollHeight;
}
function ingest(v) {
  if (!v) return;
  PL.offset = (v.now || pnow()) - pnow();
  PL.view = v;
  for (const e of v.ev) {
    if (e.seq <= PL.since) continue;
    const seed = PL.id + ':' + e.seq;
    switch (e.k) {
      case 'join': addLog(`${liveB(e.by)} sits down.`, 'sys', e.by); break;
      case 'left': addLog('Someone got up and left.', 'sys'); break;
      case 'autopilot': addLog(`${liveB(e.by)}'s player left. Its re:gen plays on by itself.`, 'sys', e.by); break;
      case 'deal': addLog(`The cards go around. ${e.n} at the table. One of them is a rat.`, 'sys'); break;
      case 'role': addLog(e.rat ? `<b class="red">You're the rat.</b> Steer them wrong. At night you pick who goes out back.` : `<b>You're clean.</b> Find the rat before it thins the table.`, 'big', v.you); break;
      case 'day': addLog(e.d === 1 ? 'Day one. Nobody trusts anybody yet.' : `Day ${e.d}. ${e.alive.filter(Boolean).length} left at the table.`, 'sys'); PL.sel = -1; break;
      case 'tip': PL.notes.push(`Day ${v.day}: a tip says ${liveName(e.on)} was by the back door. Tips can be wrong.`); addLog(`<i>You got a tip: somebody saw ${liveB(e.on)} by the back door.</i>`, 'tip', v.you); break;
      case 'probe': PL.notes.push(`Your probe on ${liveName(e.on)}: ${e.dirty ? 'DIRTY' : 'clean'} (right 3 times in 4).`); addLog(`<i>Your probe reads ${liveB(e.on)} as <b>${e.dirty ? 'dirty' : 'clean'}</b>.</i>`, 'tip', v.you); break;
      case 'wrap': addLog(`${liveB(e.by)} wraps ${liveB(e.on)} up tight. No talking for a day.`, '', e.by); PL.talk = { by: e.by, on: e.on, kind: 'wrap', until: pnow() + 2200 }; break;
      case 'say': {
        let html = lineFor(e, liveName, seed);
        if (e.noticed && e.noticed.length) html += ` <span class="muted">${e.noticed.slice(0, 2).map(liveB).join(' and ')} caught a tell.</span>`;
        addLog(html, e.by === v.you ? 'mine' : '', e.by);
        PL.talk = { by: e.by, on: e.on, kind: e.kind, until: pnow() + 2400 };
        break;
      }
      case 'callvote': addLog('Talk is over. <b>Vote.</b> Tap a face, or keep your hand down.', 'sys'); PL.sel = -1; break;
      case 'vote': {
        PL.voteAnim = { votes: e.votes, out: e.out, at: pnow() };
        const mine = e.votes.find(x => x[0] === v.you);
        if (e.out < 0) addLog('Split table. Nobody goes out back.', 'sys');
        else {
          PL.reveal[e.out] = e.wasRat ? 'rat' : 'clean';
          const t = e.tally[e.out], n = t % 1 ? Math.floor(t) + '½' : t;
          addLog(e.wasRat ? `${liveB(e.out)} goes out back with ${n} votes… <b class="red">That was the rat.</b>` : `${liveB(e.out)} goes out back with ${n} votes. <span class="muted">Clean. Wrong call.</span>`, e.wasRat ? 'big' : 'sys', e.out);
        }
        if (mine && mine[1] >= 0) addLog(`<span class="muted">You voted for ${esc(liveName(mine[1]))}.</span>`, 'sys');
        break;
      }
      case 'lights': addLog(v.role === 'rat' ? 'Lights out. <b class="red">Pick who goes out back.</b>' : 'Lights out. Hope it isn\'t you.', 'sys'); PL.sel = -1; break;
      case 'night':
        if (e.back) addLog(`${liveB(e.on)} got taken out back… and walked right back in.`, '', e.on);
        else { PL.reveal[e.on] = 'clean'; addLog(e.on === v.you ? '<b>You got taken out back.</b> Watch how it ends.' : `${liveB(e.on)} got taken out back. Clean, for what it's worth.`, '', e.on); }
        break;
      case 'end': {

function renderAll() { renderChip(); renderWatchList(); renderBoard(); renderEnter(); renderLore(); if (!PL.view) renderPlay(); }

let last = performance.now(), tickT = 0;
function frame(t) {
  const dt = Math.min(100, t - last); last = t;
  if (!$('#tab-watch').hidden) { update(dt); draw(t); } else update(dt);
  playFrame(t, dt);
  if ((tickT += dt) > 1000) { tickT = 0; tick(); }
  requestAnimationFrame(frame);
}

async function boot() {
  showTab(location.hash.slice(1) || 'watch');
  // show the house straight away while the roster loads
  recompute(); renderAll(); autoPick();
  requestAnimationFrame(frame);
  const shared = await initShared();
  if (!shared) {
    const site = await probeSite();
    if (site) startSite(site); else loadLocal();
    recompute(); renderAll(); if (!PB.bout || PB.phase === 'idle') autoPick();
  }
}
window.__pl = PL; window.__brawl = { M, S, PB, W8, PL, recompute, renderAll, play, autoPick, setOffset(ms) { clockOffset = ms; recompute(); renderAll(); autoPick(); } };
boot();
})();
</script>
